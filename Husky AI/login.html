
            <!-- ====================== Anurag: LEFT FORM COLUMN ====================== -->

          <div class="col-lg-6 p-4">
            <a href="index.html" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Back</a>
            <h1 class="h3 mb-3 fw-bold mt-2"><i class="bi bi-hurricane me-1"></i> <span class="brand">BrandName</span> Login</h1>
            <p class="text-secondary small">Use any email; password rules are enforced client-side for the assignment demo.</p>

            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm" class="needs-validation" novalidate>
              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
                <label for="email">Email address</label>
                <div class="invalid-feedback">Please enter a valid email.</div>
              </div>

              <div class="input-group mb-2">
                <div class="form-floating flex-grow-1">
                  <input type="password" class="form-control" id="password" placeholder="Password" aria-describedby="togglePwd" required />
                  <label for="password">Password</label>
                  <div class="invalid-feedback">Password must be 8+ chars with upper, lower & number.</div>
                </div>
                <button class="btn btn-outline-secondary" type="button" id="togglePwd" data-bs-toggle="tooltip" data-bs-title="Show/Hide password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>

              <div class="progress my-2" role="progressbar" aria-label="Password strength">
                <div id="pwdStrength" class="progress-bar" style="width: 0%"></div>
              </div>
              <div class="form-text mb-3">Use at least 8 characters with a mix of letters and numbers.</div>

              <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="remember" />
                <label class="form-check-label" for="remember">Remember me (demo only)</label>
              </div>

              <div class="d-grid gap-2">
                <button class="btn btn-primary" id="loginBtn" type="submit">
                  <span class="btn-text">Sign in</span>
                  <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
                <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#resetModal">
                  Forgot password
                </button>
              </div>
            </form>

            <p class="mt-4 mb-0 text-secondary small">
              By continuing, you agree to our <a href="#" class="link-secondary">Terms</a> and <a href="#" class="link-secondary">Privacy</a>.
            </p>
          </div>
       
  </body>
</html>
